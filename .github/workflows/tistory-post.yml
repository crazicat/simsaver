name: 티스토리 블로그 포스팅

on:
  workflow_dispatch:
    inputs:
      post_title:
        description: '포스트 제목'
        required: true
        default: '2026 알뜰폰 요금제 완전 비교 — 24개 사업자 총정리 (최저가 순)'
      post_tag:
        description: '태그 (쉼표 구분)'
        required: false
        default: '알뜰폰,요금제비교,알뜰폰추천,KT망,SKT망'
      post_category:
        description: '카테고리 ID (Tistory 블로그 카테고리 ID)'
        required: false
        default: ''

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 포스트 내용 준비
        id: content
        run: |
          cat << 'CONTENT' > post.html
          <h2>알뜰폰 요금제 비교, 왜 복잡한가요?</h2>
          <p>국내 알뜰폰(MVNO) 사업자는 현재 60개가 넘습니다. 그 중 실제로 직접 요금제를 운영하는 사업자만 24개 이상이고, 각 사업자마다 수십~수백 개의 요금제를 판매합니다.</p>
          <p>혼자 하나씩 비교하면 며칠이 걸립니다. 이 글에서는 <a href="https://simsaver.vercel.app">알뜰폰갤러리</a>에서 수집한 최신 데이터를 바탕으로, 가격대별·망별로 핵심 요금제만 뽑아 정리했습니다.</p>

          <h2>알뜰폰 기본 개념 (3분 요약)</h2>
          <p><strong>알뜰폰(MVNO)이란?</strong><br>SKT·KT·LGU+ 통신 3사의 망을 빌려 서비스하는 통신사입니다. 망 품질은 동일하고 요금만 30~70% 저렴합니다.</p>

          <table border="1" style="border-collapse:collapse;width:100%">
          <thead><tr><th>망</th><th>특징</th><th>대표 알뜰폰</th></tr></thead>
          <tbody>
          <tr><td>SKT망</td><td>전국 커버리지 최강, 농어촌 강세</td><td>SK7mobile, 토스모바일</td></tr>
          <tr><td>KT망</td><td>속도·커버리지 균형, 5G 넓음</td><td>핀다이렉트, 스노우맨, 헬로모바일</td></tr>
          <tr><td>LGU+망</td><td>도심 데이터 속도 강세</td><td>LG헬로모바일, U+알뜰모바일</td></tr>
          </tbody></table>

          <h2>월 1만원대 알뜰폰 요금제 TOP 5</h2>
          <table border="1" style="border-collapse:collapse;width:100%">
          <thead><tr><th>순위</th><th>사업자</th><th>요금제</th><th>월 요금</th><th>데이터</th><th>망</th></tr></thead>
          <tbody>
          <tr><td>1</td><td>스노우맨</td><td>데이터 3GB</td><td>9,900원</td><td>3GB (소진 후 1Mbps)</td><td>KT</td></tr>
          <tr><td>2</td><td>핀다이렉트</td><td>알뜰 10GB</td><td>12,900원</td><td>10GB (소진 후 1Mbps)</td><td>KT</td></tr>
          <tr><td>3</td><td>SK7mobile</td><td>베이직 5GB</td><td>13,200원</td><td>5GB (소진 후 400Kbps)</td><td>SKT</td></tr>
          <tr><td>4</td><td>스마텔</td><td>스마트 8GB</td><td>14,900원</td><td>8GB (소진 후 1Mbps)</td><td>KT·LGU+</td></tr>
          <tr><td>5</td><td>LG헬로모바일</td><td>실속 12GB</td><td>15,900원</td><td>12GB (소진 후 1Mbps)</td><td>LGU+</td></tr>
          </tbody></table>

          <h2>월 2만원대 알뜰폰 요금제 TOP 5</h2>
          <table border="1" style="border-collapse:collapse;width:100%">
          <thead><tr><th>순위</th><th>사업자</th><th>요금제</th><th>월 요금</th><th>데이터</th><th>망</th></tr></thead>
          <tbody>
          <tr><td>1</td><td>핀다이렉트</td><td>데이터 24GB</td><td>19,800원</td><td>24GB (소진 후 5Mbps)</td><td>KT</td></tr>
          <tr><td>2</td><td>스노우맨</td><td>실속형 25GB</td><td>21,900원</td><td>25GB (소진 후 3Mbps)</td><td>KT</td></tr>
          <tr><td>3</td><td>SK7mobile</td><td>알뜰 30GB</td><td>22,000원</td><td>30GB (소진 후 1Mbps)</td><td>SKT</td></tr>
          <tr><td>4</td><td>LG헬로모바일</td><td>헬로 25GB</td><td>24,200원</td><td>25GB (소진 후 3Mbps)</td><td>LGU+</td></tr>
          <tr><td>5</td><td>KB리브엠</td><td>리브엠 27GB</td><td>25,000원</td><td>27GB (소진 후 5Mbps)</td><td>KT·LGU+</td></tr>
          </tbody></table>

          <h2>데이터 무제한 알뜰폰 요금제 TOP 5</h2>
          <table border="1" style="border-collapse:collapse;width:100%">
          <thead><tr><th>순위</th><th>사업자</th><th>요금제</th><th>월 요금</th><th>망</th></tr></thead>
          <tbody>
          <tr><td>1</td><td>핀다이렉트</td><td>무제한+</td><td>32,900원</td><td>KT</td></tr>
          <tr><td>2</td><td>SK7mobile</td><td>완전무제한</td><td>35,200원</td><td>SKT</td></tr>
          <tr><td>3</td><td>LG헬로모바일</td><td>헬로 무제한</td><td>36,900원</td><td>LGU+</td></tr>
          <tr><td>4</td><td>KT 요고</td><td>YOGO 무제한</td><td>38,500원</td><td>KT 5G</td></tr>
          <tr><td>5</td><td>KB리브엠</td><td>리브엠 무제한</td><td>39,800원</td><td>KT·LGU+</td></tr>
          </tbody></table>

          <h2>알뜰폰 선택 체크리스트</h2>
          <ol>
          <li><strong>내 지역 커버리지</strong>: 거주지·직장에서 어느 망이 더 잘 터지나요?</li>
          <li><strong>월 데이터 사용량</strong>: 최근 3개월 평균 사용량 확인 (통신사 앱에서 조회)</li>
          <li><strong>약정 여부</strong>: 무약정 원하면 약정 요금제 피하기</li>
          <li><strong>유심비 포함 여부</strong>: 요금제 가격에 유심비 포함인지 확인</li>
          <li><strong>번호이동 vs 신규</strong>: 현재 통신사 위약금 확인 후 결정</li>
          </ol>

          <h2>마무리: 지금 바로 비교하기</h2>
          <p><a href="https://simsaver.vercel.app"><strong>알뜰폰갤러리</strong></a>에서 24개 사업자 요금제를 가격순·망별로 필터링해 내게 딱 맞는 요금제를 찾아보세요. 매일 새벽 자동으로 업데이트되어 항상 최신 요금을 확인할 수 있습니다.</p>
          <p><em>※ 이 글의 요금 정보는 알뜰폰갤러리 수집 데이터 기준이며, 실제 요금은 각 통신사에서 확인하세요.</em></p>
          CONTENT

      - name: 티스토리 API로 포스트 발행
        run: |
          CONTENT=$(cat post.html)
          RESPONSE=$(curl -s -X POST "https://www.tistory.com/apis/post/write" \
            --data-urlencode "access_token=${{ secrets.TISTORY_ACCESS_TOKEN }}" \
            --data-urlencode "output=json" \
            --data-urlencode "blogName=${{ secrets.TISTORY_BLOG_NAME }}" \
            --data-urlencode "title=${{ github.event.inputs.post_title }}" \
            --data-urlencode "content=${CONTENT}" \
            --data-urlencode "visibility=3" \
            --data-urlencode "published=$(date +%s)" \
            --data-urlencode "tag=${{ github.event.inputs.post_tag }}" \
            --data-urlencode "category=${{ github.event.inputs.post_category }}")

          echo "API 응답: $RESPONSE"

          # 성공 여부 확인
          STATUS=$(echo $RESPONSE | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('tistory',{}).get('status','unknown'))" 2>/dev/null)
          echo "상태: $STATUS"

          if [ "$STATUS" = "200" ]; then
            POST_URL=$(echo $RESPONSE | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('tistory',{}).get('url',''))" 2>/dev/null)
            echo "✅ 포스트 발행 성공!"
            echo "URL: $POST_URL"
          else
            echo "❌ 포스트 발행 실패. 응답 확인 필요."
            exit 1
          fi
